---
apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  annotations:
    controller-gen.kubebuilder.io/version: v0.19.0
  name: wireguardinterfacengs.networking.dn42.io
spec:
  group: networking.dn42.io
  names:
    kind: WireGuardInterfaceNG
    listKind: WireGuardInterfaceNGList
    plural: wireguardinterfacengs
    shortNames:
    - wging
    - wgifng
    singular: wireguardinterfaceng
  scope: Namespaced
  versions:
  - name: v1alpha1
    schema:
      openAPIV3Schema:
        description: WireGuardInterfaceNG is a specification for a WireGuardInterfaceNG
          resource
        properties:
          apiVersion:
            description: |-
              APIVersion defines the versioned schema of this representation of an object.
              Servers should convert recognized schemas to the latest internal value, and
              may reject unrecognized values.
              More info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#resources
            type: string
          kind:
            description: |-
              Kind is a string value representing the REST resource this object represents.
              Servers may infer this from the endpoint the client submits requests to.
              Cannot be updated.
              In CamelCase.
              More info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#types-kinds
            type: string
          metadata:
            type: object
          spec:
            description: WireGuardInterfaceNGSpec is the spec for a WireGuardInterfaceNG
              resource
            properties:
              addresses:
                description: Addresses specifies the addresses that are gonna to be
                  assigned to the interface.
                items:
                  properties:
                    cidr:
                      type: string
                    local:
                      type: string
                    peer:
                      type: string
                  type: object
                type: array
              container:
                description: If set to nil, the resource would be provisioned in the
                  host netns, and `MoveToContainer` would be ignored.
                properties:
                  docker:
                    type: string
                  host_netns:
                    description: When specified, would use host netns, however, mostly
                      you should not use this, it's dangerous.
                    type: boolean
                  netns_path:
                    type: string
                  podman:
                    type: string
                type: object
              interfaceName:
                description: Name of the interface to be created, it is required otherwise
                  the controller would have no idea what to create.
                type: string
              listenPort:
                description: |-
                  ListenPort specifies the port that the interface would listen on.
                  If unspecified, or specified a value of 0, the controller would try to generate one in the range of [11024, 65535].
                type: integer
              mtu:
                description: |-
                  MTU specifies the MTU of the interface.
                  Under most cases, the system would automatically determine a most appropriate MTU value for you.
                type: integer
              node:
                type: string
              peers:
                description: |-
                  Peers specifies the other ends of the tunnel, that is where the tunnel would be connected to.
                  However these are also not mandatory in the creation of the resource, one can completely add (or delete) peers later whenever needed.
                items:
                  properties:
                    allowedIPs:
                      description: |-
                        AllowedIPs has something to do with the cryptokey-routing of WireGuard which is a wg-specific feature,
                        If you have your own routing preferences or you are running some dynamic routing protocols of your own, best to leave it empty
                        or set it to open-to-all like 0.0.0.0/0 and ::/0.
                        Because this cryptokey-routing feature is most useful at some special cases (or special architectures) like hub-and-spoke topology networks.
                      items:
                        type: string
                      type: array
                    endpoint:
                      description: |-
                        Endpoint is the clearnet endpoint of the peer, however is not mandatory and you can completely let wg working in passive mode
                        to let your peer play the proactive role.
                      type: string
                    persistentKeepalive:
                      description: |-
                        PersistentKeepalive specifies how often wg sends keepalive packets to keep the tunnel busy,
                        at many cases this is not needed since the inner layer traffic of the tunnel is already sufficient to keep the tunnel busy.
                        However at some rare cases you might still want to try set it to some appripriate value to make it more robust to survive some bad network conditions.
                      type: integer
                    presharedKeySecretRef:
                      description: |-
                        Reference to the secret resource object where the preshared key is kept.
                        Some wg users might prefer to use PresharedKey to gain enhanced security, though I do not know for what rationales.
                      properties:
                        secretRef:
                          description: |-
                            Get the secret from secret resource object if `String` is nil or empty.
                            Note when both specified, the `String` would take precedence.
                          properties:
                            key:
                              type: string
                            name:
                              type: string
                            namespace:
                              type: string
                          required:
                          - key
                          - name
                          type: object
                        string:
                          description: Get the secret from string literally.
                          type: string
                      type: object
                    publicKey:
                      description: |-
                        When a peer is specified, the publickey must be specified, since it uniquely identifies a peer in a tunnel.
                        So if you don't know the public key of your peer, better add the peer later whenever you know it.
                      type: string
                  required:
                  - publicKey
                  type: object
                type: array
              privateKey:
                description: |-
                  If PrivateKey is provided, the PrivateKeySecretRef will not be used.
                  Note if both PrivateKey and PrivateKeySecretRef are provided, the former would take precedence.
                  And when both are ignored, the controller would try to generate one on-the-fly and won't store the generated key to anywhere.
                properties:
                  secretRef:
                    description: |-
                      Get the secret from secret resource object if `String` is nil or empty.
                      Note when both specified, the `String` would take precedence.
                    properties:
                      key:
                        type: string
                      name:
                        type: string
                      namespace:
                        type: string
                    required:
                    - key
                    - name
                    type: object
                  string:
                    description: Get the secret from string literally.
                    type: string
                type: object
              vrf:
                description: |-
                  If set to nil, would create the interface in the default VRF.
                  Otherwise, create the interface in the named VRF. Try not to use 'default' as the name of the VRF.
                type: string
            required:
            - interfaceName
            - node
            type: object
          status:
            properties:
              nodename:
                description: |-
                  Nodename is name of the node where the interface is provisioned.
                  The node name can be overridden by the operator running on the node.
                type: string
              resource:
                description: Status of underlying resource in the node's system.
                properties:
                  interface_status:
                    properties:
                      addresses:
                        items:
                          type: string
                        type: array
                      flags:
                        type: string
                      mtu:
                        type: integer
                      oper_state:
                        type: string
                    required:
                    - addresses
                    - flags
                    - mtu
                    - oper_state
                    type: object
                  listen_port:
                    type: integer
                  peers:
                    items:
                      properties:
                        allowedips:
                          items:
                            type: string
                          type: array
                        endpoint:
                          type: string
                        persistent_keepalive:
                          description: Seconds of PKL
                          type: integer
                        preshared_key:
                          type: string
                        public_key:
                          type: string
                      required:
                      - public_key
                      type: object
                    type: array
                  public_key:
                    type: string
                required:
                - listen_port
                - public_key
                type: object
            required:
            - nodename
            type: object
        required:
        - metadata
        - spec
        type: object
    served: true
    storage: true
    subresources:
      status: {}
