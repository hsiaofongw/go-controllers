  name: wireguardnetworkplans.networking.dn42.io
spec:
  group: networking.dn42.io
  names:
    kind: WireGuardNetworkPlan
    listKind: WireGuardNetworkPlanList
    plural: wireguardnetworkplans
    shortNames:
    - wgplan
    - wgp
    singular: wireguardnetworkplan
  scope: Namespaced
  versions:
  - name: v1alpha1
    schema:
      openAPIV3Schema:
        description: WireGuardNetworkPlan is a specification for a WireGuardNetworkPlan
          resource
        properties:
          apiVersion:
            description: |-
              APIVersion defines the versioned schema of this representation of an object.
              Servers should convert recognized schemas to the latest internal value, and
              may reject unrecognized values.
              More info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#resources
            type: string
          kind:
            description: |-
              Kind is a string value representing the REST resource this object represents.
              Servers may infer this from the endpoint the client submits requests to.
              Cannot be updated.
              In CamelCase.
              More info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#types-kinds
            type: string
          metadata:
            type: object
          spec:
            description: WireGuardNetworkPlanSpec is the spec for a WireGuardNetworkPlan
              resource
            properties:
              defaultPortRange:
                description: |-
                  DefaultPortRange is the default port range to allocate for the WireGuard ListenPort.
                  If a node has its own `Underlay` field, or the node is behind a NAT, the `DefaultPortRange` is not used.
                properties:
                  end:
                    type: integer
                  start:
                    type: integer
                required:
                - end
                - start
                type: object
              links:
                items:
                  properties:
                    fromNode:
                      type: string
                    toNodes:
                      items:
                        properties:
                          addresses:
                            items:
                              properties:
                                family:
                                  type: string
                                local:
                                  type: string
                                peer:
                                  type: string
                                prefixlen:
                                  type: integer
                              required:
                              - family
                              - local
                              - peer
                              - prefixlen
                              type: object
                            type: array
                          nodeName:
                            type: string
                          overrideAddresses:
                            description: If this is true, the per-link addresses specified
