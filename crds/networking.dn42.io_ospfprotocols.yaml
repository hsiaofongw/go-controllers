---
apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  annotations:
    controller-gen.kubebuilder.io/version: v0.19.0
  name: ospfprotocols.networking.dn42.io
spec:
  group: networking.dn42.io
  names:
    kind: OSPFProtocol
    listKind: OSPFProtocolList
    plural: ospfprotocols
    shortNames:
    - ospf
    singular: ospfprotocol
  scope: Namespaced
  versions:
  - name: v1alpha1
    schema:
      openAPIV3Schema:
        description: OSPFProtocol is a specification for a OSPFProtocol resource
        properties:
          apiVersion:
            description: |-
              APIVersion defines the versioned schema of this representation of an object.
              Servers should convert recognized schemas to the latest internal value, and
              may reject unrecognized values.
              More info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#resources
            type: string
          kind:
            description: |-
              Kind is a string value representing the REST resource this object represents.
              Servers may infer this from the endpoint the client submits requests to.
              Cannot be updated.
              In CamelCase.
              More info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#types-kinds
            type: string
          metadata:
            type: object
          spec:
            description: OSPFProtocolSpec is the spec for a OSPFProtocol resource
            properties:
              driver:
                description: Currently only frr is supported.
                type: string
              interfaces:
                description: |-
                  These are interface-specific OSPF configurations.
                  Note: once applied, modify the content of a `OSPFProtocolInterfaceSpec` will not take effect,
                  the only way to alter the configuration is to delete the old `OSPFProtocolInterfaceSpec` and create a new one.
                items:
                  properties:
                    area:
                      description: |-
                        Area is the area ID of the OSPF protocol.
                        It can be a string of 4-octet integer or a string of 4 dot-decimal integers,
                        like "0" or "0.0.0.0" or "1.2.3.4".
                      type: string
                    interfaceName:
                      description: |-
                        The name of the interface where the OSPF configuration is applied to.
                        The VRF name of the interface is specified implicitly by the moment of creating the interface.
                      type: string
                    networkType:
                      description: OSPF network type, it affects the way of doing
                        neighbor discovery.
                      type: string
                    passive:
                      description: |-
                        Do not speak OSPF on the interface,
                        but do advertise the interface as a stub link in the router-LSA for this router.
                        So that the subnet where the interface is connected to will appear as a stub network in the lsdb.
                      type: boolean
                    vrf:
                      description: |-
                        One must specify the VRF name to associate it with the VRF-enslaved OSPF router instance
                        if the VRF name is nil, it is treated as the default VRF
                      type: string
                  required:
                  - area
                  - interfaceName
                  - networkType
                  type: object
                type: array
              node:
                type: string
              routers:
                description: |-
                  Multiple routers can be configured on a single FRR ospfd instance,
                  however, only one OSPF router instance can use the default vrf.
                items:
                  properties:
                    neighbors:
                      description: |-
                        For Non-broadcast Multi-access (NBMA) networks or point-to-multipoint networks,
                        where the neighbor discovery can't be done by multicast flooding and one
                        have to manually specify the neighbors. Format: A.B.C.D.
                      items:
                        type: string
                      type: array
                    routerID:
                      description: |-
                        RouterID used to identify the router and indicate the router that generate the LSA,
                        It is not necessary to be reachable, as long as it is unique across the network.
                        It can be a string of 4-octet integer or a string of 4 dot-decimal integers,
                        like "0" or "0.0.0.0" or "1.2.3.4".
                      type: string
                    vrf:
                      description: VRF, VRF only supported in FRR
                      type: string
                  required:
                  - routerID
                  type: object
                type: array
              version:
                description: Currently only v2 is supported.
                type: string
            required:
            - driver
            - interfaces
            - node
            - routers
            - version
            type: object
          status:
            properties:
              driver:
                type: string
              hostname:
                description: |2-
                   Hostname of the node where the interface is provisioned,
                  or the hostname of the host of the container in case of containerization.
                  This is used to identify the node where the interface is provisioned.
                type: string
              interfaces:
                items:
                  properties:
                    area:
                      type: string
                    ifFlags:
                      type: string
                    ifUp:
                      type: boolean
                    ifaceName:
                      type: string
                    lsaRetransmissions:
                      type: integer
                    mtuBytes:
                      type: integer
                    nbrAdjacentCount:
                      type: integer
                    nbrCount:
                      type: integer
                    networkType:
                      type: string
                    routerID:
                      type: string
                    vrfName:
                      type: string
                  required:
                  - ifaceName
                  type: object
                type: array
              nodename:
                description: |-
                  Node name where the interface is provisioned.
                  The node name can be overridden by the operator running on the node.
                type: string
              observedGeneration:
                description: The most recent generation observed by the controller.
                format: int64
                type: integer
              routers:
                items:
                  properties:
                    areas:
                      items:
                        properties:
                          area:
                            type: string
                          areaIfActive:
                            type: integer
                          areaIfaceTotal:
                            type: integer
                          backbone:
                            type: boolean
                          lsaNetworkNumber:
                            type: integer
                          lsaNumber:
                            type: integer
                          lsaRouterNumber:
                            type: integer
                          nbrFullAdjacentCount:
                            type: integer
                        required:
                        - area
                        type: object
                      type: array
                    preference:
                      type: integer
                    routerID:
                      type: string
                    vrfName:
                      type: string
                  type: object
                type: array
              version:
                type: string
            required:
            - driver
            - hostname
            - nodename
            - observedGeneration
            - version
            type: object
        required:
        - metadata
        - spec
        type: object
    served: true
    storage: true
    subresources:
      status: {}
